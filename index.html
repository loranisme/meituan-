<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meituan Together | 一起去</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: "#f7c600",
              "brand-edge": "#e8b600",
              ink: "#1f2329",
              muted: "#667085",
              line: "#ebedf0",
              surface: "#f8f9fb",
            },
            fontFamily: {
              sans: [
                "-apple-system",
                "BlinkMacSystemFont",
                '"PingFang SC"',
                '"Microsoft YaHei"',
                "sans-serif",
              ],
            },
            boxShadow: {
              card: "0 2px 12px rgba(15,23,42,0.06)",
              sheet: "0 -10px 30px rgba(15,23,42,0.12)",
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="./style.css" />
    <style type="text/tailwindcss">
      @layer base {
        body {
          @apply font-sans bg-[#f5f5f5] text-ink text-sm;
          margin: 0;
          padding-bottom: 76px;
        }
        button,
        textarea {
          font: inherit;
        }
        button {
          @apply cursor-pointer border-0;
        }
        h1,
        h2,
        h3,
        p {
          margin: 0;
        }
        h1 {
          @apply text-[32px] font-bold leading-tight;
        }
        h2 {
          @apply text-[22px] font-semibold leading-snug;
        }
        h3 {
          @apply text-base font-semibold leading-snug;
        }
        .muted {
          @apply text-muted leading-relaxed;
        }
      }

      @layer components {
        /* ---------- Layout ---------- */
        .phone-shell {
          @apply mx-auto min-h-screen bg-[#f7f8fa] w-full max-w-[430px];
          padding: 14px 12px 18px;
        }
        .app-header {
          @apply flex justify-between items-center;
          padding: 6px 2px 12px;
        }
        .app-header h1 {
          @apply text-[32px];
        }
        .eyebrow {
          @apply text-muted text-xs font-extrabold uppercase;
        }
        .icon-button {
          @apply w-10 h-10 rounded-full bg-white border border-line text-xl;
        }
        .page {
          display: none;
        }
        .page.is-active {
          display: block;
        }

        /* ---------- Cards (一级 / 二级降级) ---------- */
        .card {
          @apply bg-white border border-[#f0f1f3] rounded-3xl p-5 mb-3.5 shadow-card;
        }
        .card .card {
          @apply bg-surface border-[#eceef2] rounded-2xl shadow-none mb-2;
          padding: 12px 14px;
        }

        /* ---------- Buttons ---------- */
        .primary-button {
          @apply bg-brand text-gray-900 border border-brand-edge rounded-xl px-4 font-semibold text-base;
          min-height: 48px;
        }
        .primary-button.is-loading {
          @apply opacity-75 relative;
        }
        .secondary-button {
          @apply bg-white border border-gray-300 text-gray-700 rounded-xl px-4 font-semibold;
          min-height: 48px;
        }
        .wide {
          @apply w-full;
        }
        .text-button {
          @apply bg-white border border-line rounded-[10px] px-3 py-2 font-extrabold whitespace-nowrap text-ink;
        }

        /* ---------- Filter chips ---------- */
        .tabs-row,
        .prompt-row,
        .quick-replies {
          @apply flex gap-2 overflow-x-auto pb-2;
        }
        #filterTabsRow {
          @apply flex flex-col gap-0 overflow-visible pb-1;
        }
        .filter-chip,
        .prompt-row button,
        .quick-replies button {
          @apply bg-white border border-line rounded-[10px] px-3 py-2 font-extrabold whitespace-nowrap text-ink transition-colors;
        }
        .filter-chip:hover:not(.is-active) {
          @apply bg-gray-50 border-gray-400;
        }
        .filter-chip.is-active {
          @apply bg-gray-900 text-white;
        }
        .filter-chip:active {
          transform: scale(0.92);
        }
        .action-grid {
          @apply grid grid-cols-2 gap-2 mt-2.5;
        }
        .chip-count {
          @apply inline-block ml-1 bg-black/10 rounded-full text-[10px] px-1.5 py-px font-extrabold align-middle;
        }
        .filter-chip.is-active .chip-count {
          @apply bg-white/25;
        }

        /* ---------- Category chips ---------- */
        .category-chips-row {
          @apply flex gap-2 overflow-x-auto pb-1.5;
        }

        /* ---------- Tag pills ---------- */
        .meta-row,
        .tag-row,
        .confirm-row {
          @apply flex gap-2 flex-wrap;
        }
        .meta-row {
          @apply pb-2;
        }
        .tag-row {
          @apply pt-2 pb-1;
        }
        .confirm-row {
          @apply pb-2 overflow-x-auto;
        }
        .meta-row span,
        .tag-row span,
        .confirm-row span {
          @apply bg-gray-100 rounded-full px-2.5 py-1.5 text-gray-700 text-xs;
        }
        .confirm-row span.ok {
          @apply bg-green-100 text-green-800;
        }

        /* ---------- Map stats ---------- */
        .map-stats {
          @apply grid grid-cols-4 gap-2;
        }
        .map-stats div {
          min-width: 0;
        }
        .map-stats b {
          @apply block text-[17px];
        }
        .map-stats span {
          @apply block text-muted text-[11px] mt-0.5;
        }

        /* ---------- POI sheet ---------- */
        .poi-sheet {
          @apply relative z-[5] rounded-t-[18px] rounded-b-xl overflow-hidden shadow-sheet;
          margin-top: -84px;
        }
        .sheet-title-row {
          @apply flex items-center gap-2 flex-wrap mb-1;
        }
        .sheet-title-row h2 {
          margin: 0;
        }
        .sheet-match {
          @apply bg-gray-900 text-white text-[11px] font-extrabold rounded-full whitespace-nowrap;
          padding: 3px 8px;
        }

        /* ---------- Demand cards ---------- */
        .demand-list {
          @apply grid gap-2 my-2.5;
        }
        .demand-carousel {
          @apply flex overflow-x-auto pt-0.5 pb-2;
          scroll-snap-type: x mandatory;
        }
        .demand-card {
          @apply border border-line rounded-2xl p-2.5 min-w-[238px] bg-white flex gap-2.5 items-start;
          scroll-snap-align: start;
        }
        .demand-card.is-selected {
          @apply border-gray-300 bg-slate-50;
          box-shadow: inset 0 0 0 1px #cbd5e1;
        }
        .demand-card p,
        .demand-card small {
          @apply text-muted leading-snug;
        }
        .empty {
          @apply text-muted;
        }

        /* ---------- AI state ---------- */
        .ai-state {
          @apply grid items-center gap-2.5;
          grid-template-columns: 28px 1fr;
        }
        .analyzing-dot {
          @apply w-4 h-4 rounded-full bg-blue-500;
          box-shadow: 0 0 0 7px rgba(59, 130, 246, 0.2);
        }
        .ai-state.is-done .analyzing-dot {
          @apply bg-green-600;
          box-shadow: 0 0 0 7px rgba(22, 163, 74, 0.12);
        }
        .ai-steps {
          @apply grid gap-2.5;
        }
        .ai-step {
          @apply grid items-center gap-2.5 text-muted;
          grid-template-columns: 28px 1fr;
        }
        .ai-step span {
          @apply w-6 h-6 rounded-full grid place-items-center bg-gray-100 font-extrabold text-xs;
        }
        .ai-step.is-active {
          @apply text-ink;
        }
        .ai-step.is-active span {
          @apply bg-blue-100 text-blue-700;
        }
        .ai-step.is-done span {
          @apply bg-green-100 text-green-800;
        }
        .result-fade {
          animation: fadeUp 0.32s ease-out both;
        }

        /* ---------- Section / notice ---------- */
        .section-title {
          @apply flex items-center justify-between mb-2.5;
          margin-top: 4px;
        }
        .notice-card {
          @apply bg-green-50 text-green-800 border border-green-200 rounded-xl p-2.5 mb-2.5 leading-normal;
        }

        /* ---------- Match score ---------- */
        .match-top {
          @apply grid items-center gap-3;
          grid-template-columns: 72px 1fr;
        }
        .score-circle {
          @apply w-[66px] h-[66px] grid place-items-center rounded-full font-bold;
          border: 8px solid #cbd5e1;
        }
        .breakdown {
          @apply grid grid-cols-3 gap-2 my-3;
        }
        .breakdown div {
          @apply bg-slate-50 rounded-xl p-2;
        }
        .breakdown span {
          @apply block text-muted text-[11px];
        }
        .breakdown b {
          @apply text-base;
        }

        /* ---------- Info boxes ---------- */
        .place-mini,
        .plan-copy,
        .deal-box,
        .deal-strip {
          @apply bg-slate-50 border border-slate-200 rounded-xl p-2.5 my-2.5 leading-snug;
        }

        /* ---------- Chat ---------- */
        .chat-profile {
          @apply grid items-center gap-3;
          grid-template-columns: 56px 1fr;
        }
        .avatar {
          @apply w-[54px] h-[54px] rounded-full grid place-items-center bg-gray-900 text-white text-[22px] font-extrabold;
        }
        .plan-card {
          @apply sticky top-0 z-[8];
        }
        .plan-card .deal-strip {
          @apply font-extrabold;
        }
        .wait-status {
          @apply my-2 text-muted font-extrabold;
        }
        .messages-card {
          min-height: 220px;
        }
        .message {
          @apply flex flex-col max-w-[78%] my-2.5;
        }
        .message span {
          @apply rounded-xl leading-normal;
          padding: 10px 12px;
        }
        .message small {
          @apply text-muted mt-0.5;
        }
        .message.me {
          @apply ml-auto items-end;
        }
        .message.me span {
          @apply bg-slate-200 text-slate-900;
        }
        .message.other span {
          @apply bg-indigo-50;
        }
        .message.ai span {
          @apply bg-green-50 text-green-900;
        }
        .confirming-banner {
          @apply my-3 p-2.5 rounded-xl bg-slate-50 border border-slate-200 font-bold text-center;
        }
        .chat-composer {
          @apply grid gap-2 mt-2.5;
          grid-template-columns: 1fr auto;
        }
        .chat-composer input {
          @apply border border-line rounded-xl;
          padding: 11px 12px;
          min-width: 0;
          font: inherit;
        }

        /* ---------- Success ---------- */
        .success-card {
          @apply text-center;
          padding: 26px 16px;
        }
        .success-mark {
          @apply w-[68px] h-[68px] mx-auto mb-3 rounded-full grid place-items-center bg-green-100 text-green-800 text-[34px] font-extrabold;
        }
        .final-plan-card {
          @apply my-3.5 border border-line rounded-xl overflow-hidden text-left;
        }
        .final-plan-card p {
          @apply flex justify-between gap-3 border-b border-line;
          padding: 10px 12px;
        }
        .final-plan-card p:last-child {
          border-bottom: 0;
        }
        .final-plan-card span {
          @apply text-muted text-right;
        }
        .platform-value {
          @apply text-muted leading-relaxed mt-3.5;
        }

        /* ---------- Health list ---------- */
        .health-list {
          @apply grid gap-2 mt-3;
        }
        .health-list div {
          @apply flex justify-between p-2.5 rounded-xl bg-slate-50;
        }

        /* ---------- Bottom nav ---------- */
        .bottom-nav {
          @apply fixed bottom-0 h-[66px] bg-white border-t border-line grid grid-cols-4 z-20 w-full max-w-[430px];
          left: 50%;
          transform: translateX(-50%);
        }
        .nav-item {
          @apply bg-white text-gray-500 font-extrabold;
        }
        .nav-item.is-active {
          @apply text-gray-900;
        }
        .nav-dot {
          @apply inline-block bg-red-500 text-white rounded-full text-[10px] not-italic font-extrabold align-middle;
          padding: 1px 5px;
          margin-left: 3px;
          line-height: 1.4;
        }

        /* ---------- Toast ---------- */
        .toast {
          @apply fixed z-40 rounded-full text-white font-bold opacity-0 pointer-events-none transition-all;
          bottom: 84px;
          left: 50%;
          transform: translate(-50%, 12px);
          max-width: min(360px, calc(100% - 32px));
          background: rgba(17, 24, 39, 0.92);
          padding: 10px 14px;
        }
        .toast.is-show {
          @apply opacity-100;
          transform: translate(-50%, 0);
        }

        /* ---------- Merchant detail ---------- */
        .merchant-detail-body {
          @apply pt-3;
        }
        .merchant-name {
          @apply text-xl;
        }
        .merchant-rating-row {
          @apply flex items-center gap-1 flex-wrap;
          margin: 4px 0 6px;
        }
        .stars {
          @apply text-sm;
          letter-spacing: -1px;
        }
        .merchant-address {
          @apply text-xs text-muted leading-snug;
          margin: 4px 0 8px;
        }
        .merchant-chips {
          @apply flex gap-1.5 flex-wrap mb-2.5;
        }
        .mchip {
          @apply bg-gray-100 rounded-full text-gray-700 text-[11px] font-extrabold;
          padding: 4px 9px;
        }
        .wait-chip {
          @apply bg-[#ececec] text-gray-700;
        }
        .deal-bar {
          @apply flex items-center gap-1.5 bg-slate-50 border border-slate-200 rounded-xl mb-3 text-[13px];
          padding: 9px 12px;
        }
        .deal-bar .deal-icon {
          @apply text-base;
        }
        .deal-bar .deal-off {
          @apply ml-auto font-extrabold text-slate-500 text-[11px];
        }
        .merchant-cta-row {
          @apply grid grid-cols-2 gap-2 mb-3.5;
        }
        .cta-nav-btn {
          @apply flex items-center justify-center bg-blue-50 border border-blue-200 rounded-xl text-[13px] font-extrabold text-blue-700 no-underline cursor-pointer transition-colors;
          padding: 10px;
        }
        .cta-nav-btn:hover {
          @apply bg-blue-100;
        }
        .cta-detail-btn {
          @apply bg-slate-50 border border-line rounded-xl text-[13px] font-extrabold text-muted cursor-pointer transition-colors;
          padding: 10px;
        }
        .cta-detail-btn:hover {
          @apply bg-slate-100;
        }
        .cta-match-btn {
          @apply bg-brand border border-brand-edge rounded-xl px-4 font-semibold text-base text-gray-900 cursor-pointer transition-opacity;
          min-height: 48px;
        }
        .cta-match-btn:hover {
          @apply opacity-90;
        }

        .open-badge {
          @apply bg-green-100 text-green-800 rounded-full text-[11px] font-extrabold;
          padding: 3px 9px;
        }

        /* ---------- Modal ---------- */
        .modal-overlay {
          @apply fixed inset-0 z-[60] flex items-end justify-center;
          background: rgba(0, 0, 0, 0.5);
        }
        .modal-sheet {
          @apply bg-white rounded-t-[20px] w-full max-w-[430px] max-h-[88vh] overflow-y-auto;
          padding-bottom: 24px;
        }
        .modal-header {
          @apply flex justify-between items-center sticky top-0 bg-white z-[2] border-b border-line;
          padding: 18px 18px 12px;
        }
        .modal-close {
          @apply w-8 h-8 rounded-full bg-gray-100 text-gray-700 text-sm;
        }
        .modal-info {
          @apply mt-1;
          padding: 0 18px;
        }
        .modal-info-row {
          @apply flex justify-between items-center border-b border-line text-sm;
          padding: 10px 0;
        }
        .modal-info-row:last-child {
          border-bottom: 0;
        }
        .modal-info-row span {
          @apply text-muted;
        }
        .modal-actions {
          @apply grid grid-cols-2 gap-2.5;
          padding: 14px 18px 0;
        }
        .replan-body {
          @apply grid gap-3;
          padding: 14px 18px 0;
        }
        .replan-context {
          @apply bg-slate-50 border border-slate-200 rounded-xl;
          padding: 12px;
        }
        .replan-context p,
        .candidate-reason {
          @apply text-xs text-muted leading-relaxed mt-1.5;
        }
        .score-formula {
          @apply bg-white border border-slate-200 rounded-lg text-slate-700 font-bold;
          padding: 7px 9px;
        }
        .replan-candidate-list {
          @apply grid gap-2.5;
        }
        .replan-candidate {
          @apply border border-line rounded-xl bg-white;
          padding: 12px;
        }
        .replan-candidate.is-selected {
          @apply border-gray-900;
          box-shadow: inset 0 0 0 1px #111827;
        }
        .candidate-head {
          @apply grid items-start gap-2;
          grid-template-columns: 34px 1fr auto;
        }
        .candidate-head p {
          @apply text-xs text-muted mt-0.5;
        }
        .candidate-head strong {
          @apply text-lg text-right leading-none;
        }
        .candidate-head strong span,
        .candidate-head strong small {
          @apply block text-[10px] text-muted font-extrabold leading-none;
        }
        .rank-badge {
          @apply w-7 h-7 rounded-full grid place-items-center bg-gray-900 text-white text-xs font-extrabold;
        }
        .candidate-metrics {
          @apply flex gap-1.5 flex-wrap mt-2;
        }
        .candidate-metrics span {
          @apply bg-gray-100 text-gray-700 rounded-full text-[11px] font-extrabold;
          padding: 4px 7px;
        }
        .replan-candidate .primary-button {
          @apply mt-2.5 min-h-[40px] text-sm;
        }
        .wait-choice-row {
          @apply border-t border-line pt-3;
        }

        /* ---------- Group chat ---------- */
        .group-list-item {
          @apply flex items-start gap-3 cursor-pointer transition-colors;
        }
        .group-list-item:active {
          @apply bg-gray-50;
        }
        .gc-list-icon {
          @apply w-11 h-11 rounded-xl bg-[#ececec] grid place-items-center text-[22px] flex-shrink-0;
        }
        .gc-list-body {
          @apply flex-1 min-w-0;
        }
        .gc-list-body h3 {
          @apply text-[15px] mb-0.5;
        }
        .gc-list-body p {
          @apply text-xs text-muted mb-0.5;
        }
        .gc-list-body small {
          @apply text-xs block overflow-hidden whitespace-nowrap;
          text-overflow: ellipsis;
        }
        .gc-list-time {
          @apply text-[11px] text-muted whitespace-nowrap mt-0.5;
        }
        .gc-header-card {
          @apply flex items-center gap-3;
        }
        .back-text-btn {
          @apply bg-transparent border-0 text-blue-500 font-extrabold text-sm cursor-pointer whitespace-nowrap;
          padding: 4px 0;
        }
        .gc-header-info {
          @apply flex items-center gap-2.5 flex-1 min-w-0;
        }
        .gc-avatar {
          @apply text-2xl;
        }
        .system-msg {
          @apply flex justify-center my-2.5;
        }
        .system-msg span {
          @apply bg-gray-100 rounded-full text-xs text-muted;
          padding: 5px 12px;
        }

        /* ---------- Success secondary ---------- */
        .success-secondary-row {
          @apply grid grid-cols-3 gap-2 mt-2;
        }
        .dc-avatar {
          @apply w-8 h-8 rounded-full bg-gray-900 text-white grid place-items-center font-extrabold text-sm flex-shrink-0;
        }

        /* ---------- Sheet buddy ---------- */
        .sheet-buddy-row {
          @apply flex items-center justify-between my-2.5 mb-1;
        }
        .sheet-buddy-row h3 {
          margin: 0;
        }
        .want-go-button {
          @apply bg-white border border-gray-300 rounded-full text-xs font-bold text-gray-700 cursor-pointer whitespace-nowrap;
          padding: 6px 12px;
        }
        .want-go-button:disabled {
          @apply opacity-50 cursor-default;
        }

        /* ---------- Plan compare table ---------- */
        .plan-compare-table {
          @apply mb-2.5 overflow-x-auto;
          padding: 12px 14px;
        }
        .pct-grid {
          @apply grid gap-0;
        }
        .pct-cell {
          @apply text-xs border-b border-line min-w-0 overflow-hidden whitespace-nowrap;
          padding: 7px 6px;
          text-overflow: ellipsis;
        }
        .pct-header-cell {
          @apply font-extrabold text-center text-[13px];
        }
        .pct-row-label {
          @apply text-muted font-extrabold;
        }
        .plan-label-A {
          @apply text-green-600;
        }
        .plan-label-B {
          @apply text-blue-600;
        }
        .plan-label-C {
          @apply text-purple-600;
        }

        /* ---------- Why details ---------- */
        .why-details {
          @apply my-2 border border-line rounded-xl overflow-hidden;
        }
        .why-details summary {
          @apply cursor-pointer font-extrabold text-[13px] flex items-center gap-1.5 text-muted;
          padding: 9px 12px;
          list-style: none;
          user-select: none;
        }
        .why-details ul {
          @apply m-0 grid gap-1.5;
          padding: 0 12px 10px 20px;
        }
        .why-details li {
          @apply text-[13px] text-ink leading-snug;
        }

        /* ---------- Verified ---------- */
        .verified-badge {
          @apply inline-block bg-green-100 text-green-800 rounded-full text-[10px] font-extrabold align-middle;
          padding: 2px 7px;
        }

        /* ---------- Intent ---------- */
        .intent-summary-card {
          padding: 12px 14px;
        }
        .intent-tags {
          @apply flex flex-wrap gap-1.5 mb-2.5;
          margin-top: 6px;
        }
        .intent-tag {
          @apply bg-gray-100 rounded-full text-gray-700 text-xs font-extrabold;
          padding: 5px 10px;
        }

        /* ---------- Safety ---------- */
        .safety-button {
          @apply bg-white border border-gray-300 rounded-xl text-[13px] font-extrabold text-gray-700 cursor-pointer w-full;
          padding: 8px 14px;
        }
        .safety-button:active {
          @apply bg-gray-100;
        }

        /* ---------- Textarea ---------- */
        textarea {
          @apply w-full border border-line rounded-xl p-3 leading-relaxed my-3;
          min-height: 126px;
          resize: vertical;
        }
      }
    </style>
  </head>
  <body>
    <main class="phone-shell">
      <header class="app-header">
        <div>
          <p id="areaLabel" class="eyebrow">Westwood 生活圈</p>
          <h1>一起去</h1>
        </div>
        <button class="icon-button" id="resetDemo" aria-label="重置">↻</button>
      </header>

      <section id="mapPage" class="page is-active"></section>
      <section id="aiPage" class="page"></section>
      <section id="chatPage" class="page"></section>
      <section id="successPage" class="page"></section>
      <section id="profilePage" class="page"></section>
    </main>

    <nav class="bottom-nav">
      <button class="nav-item is-active" data-page="map">地图</button>
      <button class="nav-item" data-page="ai">AI匹配</button>
      <button class="nav-item" data-page="chat">消息</button>
      <button class="nav-item" data-page="profile">我的</button>
    </nav>
