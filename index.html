<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>走起不 · 本地生活搭子</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: "#FFE033",
              "brand-edge": "#F5C800",
              "brand-ink": "#1A1A1A",
              ink: "#1A1A1A",
              muted: "#999999",
              line: "#EBEBEB",
              surface: "#F7F7F7",
              wash: "#F5F5F5",
              accent: "#FF6B35",
              hot: "#FF2442",
              ok: "#58CC02",
            },
            fontFamily: {
              sans: [
                "-apple-system",
                "BlinkMacSystemFont",
                '"PingFang SC"',
                '"Helvetica Neue"',
                "sans-serif",
              ],
            },
            boxShadow: {
              card: "0 2px 16px rgba(0,0,0,0.06)",
              sheet: "0 -8px 32px rgba(0,0,0,0.1)",
              btn: "0 3px 0 #E6BC00, 0 6px 16px rgba(255,193,0,0.25)",
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="./style.css" />
    <style type="text/tailwindcss">
      @layer base {
        body {
          @apply font-sans bg-wash text-ink text-[15px] antialiased;
          margin: 0;
          padding-bottom: 72px;
        }
        button,
        textarea {
          font: inherit;
        }
        button {
          @apply cursor-pointer border-0;
        }
        h1,
        h2,
        h3,
        p {
          margin: 0;
        }
        h1 {
          @apply text-[24px] font-bold leading-tight;
        }
        h2 {
          @apply text-[20px] font-bold leading-snug;
        }
        h3 {
          @apply text-[17px] font-bold leading-snug;
        }
        .muted {
          @apply text-muted leading-relaxed;
        }
      }

      @layer components {
        /* ---------- Layout ---------- */
        .phone-shell {
          @apply mx-auto min-h-screen bg-wash w-full max-w-[430px];
          padding: 0 0 18px;
        }
        .app-header {
          @apply sticky top-0 z-30 bg-wash px-3 pt-2 pb-3;
        }
        .header-top {
          @apply flex items-center justify-between mb-2.5 gap-2;
        }
        .app-logo {
          @apply flex items-center gap-2.5 min-w-0 no-underline text-inherit;
        }
        .logo-mascot {
          @apply shrink-0 drop-shadow-sm;
          width: 46px;
          height: 46px;
        }
        .logo-type {
          @apply flex flex-col min-w-0 leading-none;
        }
        .logo-type strong {
          @apply text-[24px] font-black text-ink tracking-tight;
          letter-spacing: -0.04em;
        }
        .logo-type small {
          @apply text-[11px] text-muted font-semibold mt-1 truncate;
        }
        .header-action {
          @apply text-xs font-semibold text-muted bg-white border border-line rounded-full px-3 py-1.5;
        }
        .location-pill {
          @apply w-full flex items-center gap-2.5 bg-white rounded-2xl border border-line px-3.5 py-3 text-left shadow-card;
        }
        .location-pill[hidden] {
          display: none !important;
        }
        .loc-pin {
          @apply w-9 h-9 rounded-xl bg-brand grid place-items-center shrink-0;
        }
        .loc-pin svg { display: block; }
        .loc-copy {
          @apply flex-1 min-w-0;
        }
        .loc-copy b {
          @apply block text-[16px] font-bold text-ink truncate;
        }
        .loc-copy small {
          @apply block text-xs text-muted mt-0.5 truncate;
        }
        .loc-chev {
          @apply text-muted text-lg leading-none shrink-0;
        }
        .eyebrow {
          @apply text-muted text-xs font-semibold;
        }
        .section-head {
          @apply flex items-center justify-between mb-3;
        }
        .section-head h3 {
          @apply text-[17px] font-bold;
        }
        .section-head a,
        .section-head button.linkish {
          @apply text-xs font-semibold text-accent bg-transparent border-0 p-0 cursor-pointer;
        }
        .page {
          display: none;
        }
        .page.is-active {
          display: block;
        }

        /* ---------- Cards (一级 / 二级降级) ---------- */
        .page > .card,
        .map-page-layout > .card,
        #aiPage .card,
        #chatPage .card,
        #successPage .card,
        #profilePage .card {
          @apply bg-white border-0 rounded-[18px] p-4 mb-3 shadow-card mx-3;
        }
        .card .card {
          @apply bg-surface border-0 rounded-2xl shadow-none mb-2 mx-0;
          padding: 12px 14px;
        }
        .map-page-layout .scene-filter-host {
          @apply mx-3;
        }
        .map-page-layout .map-card {
          @apply mx-3;
        }
        .map-page-layout .poi-sheet {
          @apply mx-3;
        }

        /* ---------- Buttons ---------- */
        .primary-button {
          @apply bg-brand text-brand-ink border-0 rounded-2xl px-4 font-bold text-[16px] shadow-btn;
          min-height: 50px;
        }
        .primary-button:active {
          transform: translateY(2px);
          box-shadow: none;
        }
        .primary-button.is-loading {
          @apply opacity-75 relative;
        }
        .secondary-button {
          @apply bg-white border-2 border-line text-ink rounded-2xl px-4 font-bold;
          min-height: 50px;
        }
        .wide {
          @apply w-full;
        }
        .text-button {
          @apply bg-white border border-line rounded-lg px-3 py-2 font-medium whitespace-nowrap text-ink;
        }
        .adjust-row {
          @apply flex gap-1.5 flex-wrap mt-2;
        }
        .adjust-row .text-button {
          @apply text-[12px] py-1.5 px-2.5;
        }
        .agent-clarify-card {
          @apply bg-white border-2 border-brand rounded-2xl p-3.5 mb-3 shadow-card;
        }
        .agent-clarify-card .agent-q {
          @apply text-[14px] font-bold text-ink mb-2;
        }
        .agent-clarify-card .clarify-chips {
          @apply flex flex-wrap gap-2;
        }
        .agent-clarify-card .clarify-chip {
          @apply bg-brand/20 border border-brand/50 rounded-full px-3 py-1.5 text-[13px] font-semibold text-brand-ink cursor-pointer;
        }

        /* ---------- Filter chips ---------- */
        .tabs-row,
        .prompt-row,
        .quick-replies {
          @apply flex gap-2 overflow-x-auto pb-2;
        }
        #filterTabsRow,
        .scene-filter-host {
          @apply flex flex-col gap-0 overflow-visible pb-1;
        }
        .scene-nav.card {
          @apply shadow-sm;
        }
        .filter-chip,
        .prompt-row button,
        .quick-replies button {
          @apply bg-white border border-line rounded-lg px-3 py-2 font-medium whitespace-nowrap text-ink/90 transition-colors;
        }
        .filter-chip:hover:not(.is-active) {
          @apply bg-surface border-muted/40;
        }
        .filter-chip.is-active {
          @apply bg-brand text-brand-ink border-brand font-bold;
        }
        .filter-chip:active {
          transform: scale(0.92);
        }
        .action-grid {
          @apply grid grid-cols-2 gap-2 mt-2.5;
        }
        .chip-count {
          @apply inline-block ml-1 bg-black/6 rounded-full text-[10px] px-1.5 py-px font-medium align-middle;
        }
        .filter-chip.is-active .chip-count {
          @apply bg-white/20;
        }

        /* ---------- Category chips ---------- */
        .category-chips-row {
          @apply flex gap-2 overflow-x-auto pb-1.5;
        }

        /* ---------- Tag pills ---------- */
        .meta-row,
        .tag-row,
        .confirm-row {
          @apply flex gap-2 flex-wrap;
        }
        .meta-row {
          @apply pb-2;
        }
        .tag-row {
          @apply pt-2 pb-1;
        }
        .confirm-row {
          @apply pb-2 overflow-x-auto;
        }
        .meta-row span,
        .tag-row span,
        .confirm-row span {
          @apply bg-gray-100 rounded-full px-2.5 py-1.5 text-gray-700 text-xs;
        }
        .confirm-row span.ok {
          @apply bg-[#e6f9d5] text-[#58a700] font-semibold;
        }

        /* ---------- Map stats ---------- */
        .stat-strip {
          @apply flex gap-2 overflow-x-auto pb-1 snap-x snap-mandatory;
        }
        .stat-pill {
          @apply flex-shrink-0 snap-start bg-white rounded-2xl px-3.5 py-2.5 min-w-[88px] shadow-card;
        }
        .stat-pill b {
          @apply block text-[20px] font-black text-ink leading-none;
        }
        .stat-pill span {
          @apply block text-[11px] text-muted mt-1 font-medium;
        }
        .stat-pill.is-hot b {
          @apply text-hot;
        }
        .stat-pill.is-brand {
          @apply bg-brand/30 border border-brand/50;
        }
        .stat-pill.is-brand b {
          @apply text-brand-ink;
        }

        /* ---------- Map + merchant：上下两块，不叠在地图上 ---------- */
        .map-page-layout {
          @apply flex flex-col gap-3;
        }
        .map-block {
          @apply mb-0 p-0 overflow-hidden;
        }
        .merchant-block.poi-sheet {
          @apply relative z-[1] rounded-2xl overflow-hidden shadow-card mb-3.5;
          margin-top: 0;
          padding: 0;
        }
        .poi-sheet .merchant-detail-body {
          @apply px-4 pb-4 pt-3;
        }
        .sheet-title-row {
          @apply flex items-center gap-2 flex-wrap mb-1;
        }
        .sheet-title-row h2 {
          margin: 0;
        }
        .sheet-match {
          @apply bg-hot text-white text-[11px] font-bold rounded-md whitespace-nowrap;
          padding: 3px 8px;
        }

        /* ---------- Demand cards ---------- */
        .demand-list {
          @apply grid gap-2 my-2.5;
        }
        .demand-carousel {
          @apply flex overflow-x-auto pt-0.5 pb-2;
          scroll-snap-type: x mandatory;
        }
        .demand-card {
          @apply border border-line rounded-2xl p-2.5 min-w-[238px] bg-white flex gap-2.5 items-start;
          scroll-snap-align: start;
        }
        .demand-card.is-selected {
          @apply border-brand bg-brand/10;
          box-shadow: inset 0 0 0 2px #FFE033;
        }
        .demand-card p,
        .demand-card small {
          @apply text-muted leading-snug;
        }
        .empty {
          @apply text-muted;
        }

        /* ---------- AI state ---------- */
        .ai-state {
          @apply grid items-center gap-2.5;
          grid-template-columns: 28px 1fr;
        }
        .analyzing-dot {
          @apply w-4 h-4 rounded-full bg-ok;
          box-shadow: 0 0 0 6px rgba(88, 204, 2, 0.2);
        }
        .ai-state.is-done .analyzing-dot {
          @apply bg-ok;
          box-shadow: 0 0 0 6px rgba(88, 204, 2, 0.12);
        }
        .ai-steps {
          @apply grid gap-2.5;
        }
        .ai-step {
          @apply grid items-center gap-2.5 text-muted;
          grid-template-columns: 28px 1fr;
        }
        .ai-step span {
          @apply w-6 h-6 rounded-full grid place-items-center bg-surface border border-line font-medium text-xs text-muted;
        }
        .ai-step.is-active {
          @apply text-ink;
        }
        .ai-step.is-active span {
          @apply bg-white text-ink border-muted/30;
        }
        .ai-step.is-done span {
          @apply bg-ok/15 text-ok border-ok/30 font-bold;
        }
        .ai-step.is-active span {
          @apply bg-brand text-brand-ink border-brand font-bold;
        }
        .result-fade {
          animation: fadeUp 0.32s ease-out both;
        }

        /* ---------- Section / notice ---------- */
        .section-title {
          @apply flex items-center justify-between mb-2.5;
          margin-top: 4px;
        }
        .notice-card {
          @apply bg-brand/20 text-ink border border-brand/40 rounded-2xl p-3 mb-2.5 leading-normal text-[13px] font-medium;
        }

        /* ---------- Match score ---------- */
        .match-top {
          @apply grid items-center gap-3;
          grid-template-columns: 72px 1fr;
        }
        .score-circle {
          @apply w-[66px] h-[66px] grid place-items-center rounded-full font-bold;
          border: 8px solid #cbd5e1;
        }
        .breakdown {
          @apply grid grid-cols-3 gap-2 my-3;
        }
        .breakdown div {
          @apply bg-slate-50 rounded-xl p-2;
        }
        .breakdown span {
          @apply block text-muted text-[11px];
        }
        .breakdown b {
          @apply text-base;
        }

        /* ---------- Info boxes ---------- */
        .place-mini,
        .plan-copy,
        .deal-box,
        .deal-strip {
          @apply bg-slate-50 border border-slate-200 rounded-xl p-2.5 my-2.5 leading-snug;
        }

        /* ---------- Chat ---------- */
        .chat-profile {
          @apply grid items-center gap-3;
          grid-template-columns: 56px 1fr;
        }
        .avatar {
          @apply w-[54px] h-[54px] rounded-full grid place-items-center bg-brand text-white text-lg font-medium;
        }
        .plan-card {
          @apply sticky top-0 z-[8];
        }
        .plan-card .deal-strip {
          @apply font-extrabold;
        }
        .wait-status {
          @apply my-2 text-muted font-extrabold;
        }
        .messages-card {
          min-height: 220px;
        }
        .message {
          @apply flex flex-col max-w-[78%] my-2.5;
        }
        .message span {
          @apply rounded-xl leading-normal;
          padding: 10px 12px;
        }
        .message small {
          @apply text-muted mt-0.5;
        }
        .message.me {
          @apply ml-auto items-end;
        }
        .message.me span {
          @apply bg-brand text-brand-ink font-medium;
        }
        .message.other span {
          @apply bg-white border border-line text-ink;
        }
        .message.ai span {
          @apply bg-surface border border-line text-ink/90;
        }
        .message.is-pending span {
          @apply opacity-55 italic;
        }
        .confirming-banner {
          @apply my-3 p-2.5 rounded-xl bg-slate-50 border border-slate-200 font-bold text-center;
        }
        .chat-composer {
          @apply grid gap-2 mt-2.5;
          grid-template-columns: 1fr auto;
        }
        .chat-composer input {
          @apply border border-line rounded-xl;
          padding: 11px 12px;
          min-width: 0;
          font: inherit;
        }

        /* ---------- Success ---------- */
        .success-card {
          @apply text-center;
          padding: 26px 16px;
        }
        .success-mark {
          @apply w-16 h-16 mx-auto mb-3 rounded-full grid place-items-center bg-ok text-white text-2xl font-black;
        }
        .final-plan-card {
          @apply my-3.5 border border-line rounded-xl overflow-hidden text-left;
        }
        .final-plan-card p {
          @apply flex justify-between gap-3 border-b border-line;
          padding: 10px 12px;
        }
        .final-plan-card p:last-child {
          border-bottom: 0;
        }
        .final-plan-card span {
          @apply text-muted text-right;
        }
        .platform-value {
          @apply text-muted leading-relaxed mt-3.5;
        }

        /* ---------- Health list ---------- */
        .health-list {
          @apply grid gap-2 mt-3;
        }
        .health-list div {
          @apply flex justify-between p-2.5 rounded-xl bg-slate-50;
        }

        /* ---------- Bottom nav ---------- */
        .bottom-nav {
          @apply fixed bottom-0 h-[58px] bg-white border-t border-line grid grid-cols-4 z-20 w-full max-w-[430px] pb-[env(safe-area-inset-bottom)];
          left: 50%;
          transform: translateX(-50%);
          box-shadow: 0 -4px 20px rgba(0,0,0,0.04);
        }
        .nav-item {
          @apply bg-transparent text-muted text-[10px] font-semibold flex flex-col items-center justify-center gap-0.5 pt-1;
        }
        .nav-item.is-active {
          @apply text-ink;
        }
        .nav-item.is-active .nav-icon {
          @apply bg-brand rounded-xl;
        }
        .nav-icon {
          @apply w-7 h-7 grid place-items-center rounded-lg transition-colors;
        }
        .nav-icon svg {
          display: block;
        }
        .nav-item[data-page="chat"] {
          position: relative;
        }
        .nav-dot {
          @apply absolute top-0 right-[18%] bg-hot text-white rounded-full text-[9px] not-italic font-bold;
          min-width: 14px;
          height: 14px;
          line-height: 14px;
          text-align: center;
          padding: 0 4px;
        }

        /* ---------- Toast ---------- */
        .toast {
          @apply fixed z-40 rounded-full text-white font-bold opacity-0 pointer-events-none transition-all;
          bottom: 84px;
          left: 50%;
          transform: translate(-50%, 12px);
          max-width: min(360px, calc(100% - 32px));
          background: rgba(17, 24, 39, 0.92);
          padding: 10px 14px;
        }
        .toast.is-show {
          @apply opacity-100;
          transform: translate(-50%, 0);
        }

        /* ---------- Merchant detail ---------- */
        .merchant-detail-body {
          @apply pt-3;
        }
        .merchant-name {
          @apply text-xl;
        }
        .merchant-rating-row {
          @apply flex items-center gap-1 flex-wrap;
          margin: 4px 0 6px;
        }
        .stars {
          @apply text-sm;
          letter-spacing: -1px;
        }
        .merchant-address {
          @apply text-xs text-muted leading-snug;
          margin: 4px 0 8px;
        }
        .merchant-chips {
          @apply flex gap-1.5 flex-wrap mb-2.5;
        }
        .mchip {
          @apply bg-gray-100 rounded-full text-gray-700 text-[11px] font-extrabold;
          padding: 4px 9px;
        }
        .wait-chip {
          @apply bg-[#ececec] text-gray-700;
        }
        .deal-bar {
          @apply flex items-center gap-1.5 bg-slate-50 border border-slate-200 rounded-xl mb-3 text-[13px];
          padding: 9px 12px;
        }
        .deal-bar {
          @apply bg-[#fff8f0] border-[#ffe4c4];
        }
        .deal-bar .deal-off {
          @apply ml-auto font-extrabold text-slate-500 text-[11px];
        }
        .merchant-cta-row {
          @apply grid grid-cols-2 gap-2 mb-3.5;
        }
        .cta-nav-btn {
          @apply flex items-center justify-center bg-white border border-line rounded-xl text-[13px] font-medium text-ink no-underline cursor-pointer transition-colors;
          padding: 10px;
        }
        .cta-nav-btn:hover {
          @apply bg-surface;
        }
        .cta-detail-btn {
          @apply bg-slate-50 border border-line rounded-xl text-[13px] font-extrabold text-muted cursor-pointer transition-colors;
          padding: 10px;
        }
        .cta-detail-btn:hover {
          @apply bg-slate-100;
        }
        .cta-match-btn {
          @apply bg-brand border-0 rounded-2xl px-4 font-bold text-[16px] text-brand-ink cursor-pointer shadow-btn;
          min-height: 50px;
        }
        .cta-match-btn:hover {
          @apply opacity-90;
        }

        .open-badge {
          @apply bg-ok/15 text-ok rounded-md text-[11px] font-bold;
          padding: 3px 8px;
        }

        /* ---------- Modal ---------- */
        .modal-overlay {
          @apply fixed inset-0 z-[60] flex items-end justify-center;
          background: rgba(0, 0, 0, 0.5);
        }
        .modal-sheet {
          @apply bg-white rounded-t-[20px] w-full max-w-[430px] max-h-[88vh] overflow-y-auto;
          padding-bottom: 24px;
        }
        .modal-header {
          @apply flex justify-between items-center sticky top-0 bg-white z-[2] border-b border-line;
          padding: 18px 18px 12px;
        }
        .modal-close {
          @apply rounded-lg bg-transparent text-muted text-sm font-medium px-2 py-1;
        }
        .modal-info {
          @apply mt-1;
          padding: 0 18px;
        }
        .modal-info-row {
          @apply flex justify-between items-center border-b border-line text-sm;
          padding: 10px 0;
        }
        .modal-info-row:last-child {
          border-bottom: 0;
        }
        .modal-info-row span {
          @apply text-muted;
        }
        .modal-actions {
          @apply grid grid-cols-2 gap-2.5;
          padding: 14px 18px 0;
        }
        .replan-body {
          @apply grid gap-3;
          padding: 14px 18px 0;
        }
        .replan-context {
          @apply bg-slate-50 border border-slate-200 rounded-xl;
          padding: 12px;
        }
        .replan-context p,
        .candidate-reason {
          @apply text-xs text-muted leading-relaxed mt-1.5;
        }
        .score-formula {
          @apply bg-white border border-slate-200 rounded-lg text-slate-700 font-bold;
          padding: 7px 9px;
        }
        .replan-candidate-list {
          @apply grid gap-2.5;
        }
        .replan-candidate {
          @apply border border-line rounded-xl bg-white;
          padding: 12px;
        }
        .replan-candidate.is-selected {
          @apply border-gray-900;
          box-shadow: inset 0 0 0 1px #111827;
        }
        .candidate-head {
          @apply grid items-start gap-2;
          grid-template-columns: 34px 1fr auto;
        }
        .candidate-head p {
          @apply text-xs text-muted mt-0.5;
        }
        .candidate-head strong {
          @apply text-lg text-right leading-none;
        }
        .candidate-head strong span,
        .candidate-head strong small {
          @apply block text-[10px] text-muted font-extrabold leading-none;
        }
        .rank-badge {
          @apply w-7 h-7 rounded-full grid place-items-center bg-gray-900 text-white text-xs font-extrabold;
        }
        .candidate-metrics {
          @apply flex gap-1.5 flex-wrap mt-2;
        }
        .candidate-metrics span {
          @apply bg-gray-100 text-gray-700 rounded-full text-[11px] font-extrabold;
          padding: 4px 7px;
        }
        .replan-candidate .primary-button {
          @apply mt-2.5 min-h-[40px] text-sm;
        }
        .wait-choice-row {
          @apply border-t border-line pt-3;
        }

        /* ---------- Group chat ---------- */
        .group-list-item {
          @apply flex items-start gap-3 cursor-pointer transition-colors;
        }
        .group-list-item:active {
          @apply bg-gray-50;
        }
        .gc-list-icon {
          @apply w-11 h-11 rounded-xl bg-surface border border-line grid place-items-center flex-shrink-0;
        }
        .gc-list-body {
          @apply flex-1 min-w-0;
        }
        .gc-list-body h3 {
          @apply text-[15px] mb-0.5;
        }
        .gc-list-body p {
          @apply text-xs text-muted mb-0.5;
        }
        .gc-list-body small {
          @apply text-xs block overflow-hidden whitespace-nowrap;
          text-overflow: ellipsis;
        }
        .gc-list-time {
          @apply text-[11px] text-muted whitespace-nowrap mt-0.5;
        }
        .gc-header-card {
          @apply flex items-center gap-3;
        }
        .back-text-btn {
          @apply bg-transparent border-0 text-muted font-medium text-sm cursor-pointer whitespace-nowrap;
          padding: 4px 0;
        }
        .gc-header-info {
          @apply flex items-center gap-2.5 flex-1 min-w-0;
        }
        .gc-avatar {
          @apply text-2xl;
        }
        .system-msg {
          @apply flex justify-center my-2.5;
        }
        .system-msg span {
          @apply bg-gray-100 rounded-full text-xs text-muted;
          padding: 5px 12px;
        }

        .chat-page-header {
          @apply px-4 pt-4 pb-2;
        }
        .chat-page-header h1 {
          @apply text-[20px] font-bold;
        }
        .active-chat-item {
          @apply border-l-4 border-brand;
        }
        .active-chat-icon {
          @apply bg-brand text-brand-ink font-bold text-base;
        }
        .active-match-badge {
          @apply text-[11px] font-semibold rounded-full px-2 py-0.5 whitespace-nowrap shrink-0;
          background: #FFF3CC;
          color: #92700A;
        }

        /* ---------- Success secondary ---------- */
        .success-secondary-row {
          @apply grid grid-cols-3 gap-2 mt-2;
        }
        .dc-avatar {
          @apply w-8 h-8 rounded-full bg-gray-900 text-white grid place-items-center font-extrabold text-sm flex-shrink-0;
        }

        /* ---------- Sheet buddy ---------- */
        .sheet-buddy-row {
          @apply flex items-center justify-between my-2.5 mb-1;
        }
        .sheet-buddy-row h3 {
          margin: 0;
        }
        .want-go-button {
          @apply bg-white border border-gray-300 rounded-full text-xs font-bold text-gray-700 cursor-pointer whitespace-nowrap;
          padding: 6px 12px;
        }
        .want-go-button:disabled {
          @apply opacity-50 cursor-default;
        }

        /* ---------- Plan compare table ---------- */
        .plan-compare-table {
          @apply mb-2.5 overflow-x-auto;
          padding: 12px 14px;
        }
        .pct-grid {
          @apply grid gap-0;
        }
        .pct-cell {
          @apply text-xs border-b border-line min-w-0 overflow-hidden whitespace-nowrap;
          padding: 7px 6px;
          text-overflow: ellipsis;
        }
        .pct-header-cell {
          @apply font-extrabold text-center text-[13px];
        }
        .pct-row-label {
          @apply text-muted font-extrabold;
        }
        .plan-label-A,
        .plan-label-B,
        .plan-label-C {
          @apply text-ink/70;
        }
        .scene-icon {
          @apply inline-grid place-items-center rounded-[14px] text-[15px] font-black shrink-0;
          width: 44px;
          height: 44px;
          color: var(--icon-color, #FF6B35);
          background: var(--icon-bg, #FFF4ED);
          box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .scene-icon.sm {
          width: 36px;
          height: 36px;
          font-size: 13px;
          border-radius: 12px;
        }
        .scene-icon.xs {
          width: 28px;
          height: 28px;
          font-size: 11px;
          border-radius: 10px;
        }
        .rating-num {
          @apply text-[17px] font-black text-accent tabular-nums;
        }
        .rating-star {
          @apply text-accent text-sm tracking-tight;
        }
        .progress-track {
          @apply h-2.5 bg-line rounded-full overflow-hidden;
        }
        .progress-fill {
          @apply h-full bg-brand rounded-full transition-all;
        }
        .deal-tag {
          @apply inline-block bg-hot text-white text-[10px] font-bold rounded px-1.5 py-0.5 mr-1.5 align-middle;
        }

        /* ---------- Why details ---------- */
        .why-details {
          @apply my-2 border border-line rounded-xl overflow-hidden;
        }
        .why-details summary {
          @apply cursor-pointer font-extrabold text-[13px] flex items-center gap-1.5 text-muted;
          padding: 9px 12px;
          list-style: none;
          user-select: none;
        }
        .why-details ul {
          @apply m-0 grid gap-1.5;
          padding: 0 12px 10px 20px;
        }
        .why-details li {
          @apply text-[13px] text-ink leading-snug;
        }

        /* ---------- Verified ---------- */
        .verified-badge {
          @apply inline-block bg-surface text-muted border border-line rounded-full text-[10px] font-medium align-middle;
          padding: 2px 7px;
        }

        /* ---------- Intent ---------- */
        .intent-summary-card {
          padding: 12px 14px;
        }
        .intent-tags {
          @apply flex flex-wrap gap-1.5 mb-2.5;
          margin-top: 6px;
        }
        .intent-tag {
          @apply bg-surface rounded-full text-ink text-xs font-semibold;
          padding: 6px 12px;
        }

        /* ---------- Safety ---------- */
        .safety-button {
          @apply bg-white border border-gray-300 rounded-xl text-[13px] font-extrabold text-gray-700 cursor-pointer w-full;
          padding: 8px 14px;
        }
        .safety-button:active {
          @apply bg-gray-100;
        }

        /* ---------- Textarea ---------- */
        textarea {
          @apply w-full border-2 border-line rounded-2xl p-3.5 leading-relaxed my-3 bg-white text-[15px];
          min-height: 120px;
          resize: vertical;
        }
        textarea:focus {
          outline: none;
          border-color: #FFE033;
          box-shadow: 0 0 0 3px rgba(255, 224, 51, 0.35);
        }

        /* ---------- 生活圈选择页 ---------- */
        .circle-page {
          @apply fixed inset-0 z-[80] bg-wash flex flex-col;
          max-width: 430px;
          left: 50%;
          transform: translateX(-50%);
        }
        .circle-page-header {
          @apply flex items-center gap-2 px-3 py-3 bg-white border-b border-line shrink-0;
        }
        .circle-page-header h1 {
          @apply text-[18px] font-bold flex-1;
        }
        .circle-page-body {
          @apply flex-1 overflow-y-auto px-3 pb-8;
        }
        .circle-hero {
          @apply rounded-2xl p-4 mt-3 mb-3 text-left;
          background: var(--circle-tint, #FFF8E6);
          border: 1px solid rgba(0,0,0,.04);
        }
        .circle-hero b {
          @apply block text-lg font-black text-ink;
        }
        .circle-hero p {
          @apply text-[13px] text-muted mt-1 leading-relaxed;
        }
        .circle-mini-map {
          @apply relative h-[120px] rounded-xl mt-3 overflow-hidden bg-[#e8ecf0];
        }
        .circle-tag-row {
          @apply flex flex-wrap gap-1.5 mt-3;
        }
        .circle-tag {
          @apply text-[11px] font-semibold rounded-full px-2.5 py-1 bg-white/80 text-ink/80;
        }
        .circle-list {
          @apply grid gap-2.5 mt-2;
        }
        .circle-card {
          @apply w-full text-left bg-white rounded-2xl p-3.5 border-2 border-transparent shadow-card transition-colors;
        }
        .circle-card.is-active {
          border-color: #FFE033;
          box-shadow: 0 0 0 1px #FFE033, 0 4px 16px rgba(255,224,51,.2);
        }
        .circle-card-head {
          @apply flex items-start gap-3;
        }
        .circle-card-icon {
          @apply w-11 h-11 rounded-xl grid place-items-center text-base font-black shrink-0;
          background: var(--card-tint, #f5f5f5);
          color: var(--card-accent, #FF6B35);
        }
        .circle-card h3 {
          @apply text-[16px] font-bold;
        }
        .circle-card .circle-meta {
          @apply text-xs text-muted mt-0.5;
        }
        .circle-card-stats {
          @apply flex gap-3 mt-2.5 text-[12px] text-muted;
        }
        .circle-card-stats b {
          @apply text-ink font-bold;
        }
        .circle-live {
          @apply mt-4;
        }
        .circle-live-item {
          @apply flex items-center gap-2.5 py-2.5 border-b border-line last:border-0;
        }
        .circle-live-avatar {
          @apply w-9 h-9 rounded-full bg-brand text-brand-ink grid place-items-center font-bold text-sm shrink-0;
        }
        .circle-demand-icon {
          @apply w-9 h-9 rounded-xl bg-[#FFF4ED] grid place-items-center text-lg shrink-0;
        }
        .radius-row {

        .radius-chip {

        }
        .radius-chip.is-active {

        }
        .circle-pulse-bar {
          @apply flex items-center justify-between gap-2 mt-2 text-[12px];
        }

          @apply w-2 h-2 rounded-full bg-[#58cc02] shrink-0;
          animation: livePulse 1.4s ease-in-out infinite;
        }
        .circle-weather {
          @apply inline-flex items-center gap-1.5 rounded-full bg-white/90 px-2.5 py-1 text-[11px] font-semibold text-ink/80;
        }
        .circle-ad-line {
          @apply text-[13px] text-ink/75 italic mt-2 leading-snug;
        }
        .circle-time-row {
          @apply flex gap-2 mt-3;
        }
        .circle-time-chip {
          @apply flex-1 py-2.5 rounded-xl border-2 border-white/80 bg-white/60 text-center text-[12px] font-bold text-muted;
        }
        .circle-time-chip.is-active {
          @apply border-ink/20 bg-white text-ink shadow-sm;
        }
        .circle-moment-list {
          @apply grid gap-2 mt-2;
        }

          @apply bg-white rounded-2xl p-3 shadow-card text-left w-full border-0;
        }
        .circle-moment-head {
          @apply flex items-center gap-2 mb-1.5;
        }
        .circle-moment-head b { @apply text-[14px]; }
        .circle-moment p { @apply text-[13px] text-ink/85 leading-snug; }
        .circle-moment small { @apply text-[11px] text-muted; }

          @apply flex gap-2 overflow-x-auto pb-1 mt-2;
        }
        .circle-trend-bubble {
          @apply shrink-0 px-3 py-2 rounded-full bg-white border border-line text-[12px] font-semibold text-ink whitespace-nowrap;
        }
        .circle-hot-scroll {
          @apply flex gap-2.5 overflow-x-auto pb-2 mt-2 snap-x;
        }
        .circle-hot-card {
          @apply shrink-0 w-[132px] snap-start rounded-2xl overflow-hidden bg-white shadow-card text-left border-0 p-0;
        }
        .circle-hot-cover {
          @apply h-[72px] bg-cover bg-center;
        }
        .circle-hot-body {
          @apply p-2.5;
        }
        .circle-hot-body b {
          @apply text-[13px] block truncate;
        }
        .circle-hot-body span {
          @apply text-[11px] text-muted;
        }
        .circle-inspire-grid {
          @apply grid gap-2 mt-2;
        }
        .circle-inspire {
          @apply text-left rounded-2xl p-3.5 border-2 border-line bg-white w-full;
        }
        .circle-inspire b { @apply text-[14px] block; }
        .circle-inspire span { @apply text-[12px] text-muted mt-1 block; }
        .circle-vibe-row {
          @apply flex items-center gap-2 mt-2 text-[12px] text-muted;
        }
        .circle-vibe-bar {
          @apply flex-1 h-1.5 rounded-full bg-white/70 overflow-hidden;
        }
        .circle-vibe-fill {
          @apply h-full rounded-full;
          background: linear-gradient(90deg, #a8e6cf, #ffe566);
        }
        @keyframes livePulse {
          0%, 100% { opacity: 1; transform: scale(1); }
          50% { opacity: 0.5; transform: scale(0.85); }
        }
        .map-zone-pulse::after {
          content: "";
          position: absolute;
          inset: 20%;
          border-radius: 50%;
          background: rgba(255, 107, 53, 0.2);
          animation: zonePulse 2s ease-out infinite;
        }
        @keyframes zonePulse {
          0% { transform: scale(0.6); opacity: 0.8; }
          100% { transform: scale(1.4); opacity: 0; }
        }
      }
